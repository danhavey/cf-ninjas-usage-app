<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CF Ninjas AI</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <!-- macOS-style window controls, top left. Hidden in the Chrome
           extension build, where there is no frameless window to control. -->
      <div id="windowControls" class="hidden">
        <button id="closeBtn" class="traffic traffic-close" title="Quit" aria-label="Quit"></button>
        <button id="minBtn" class="traffic traffic-min" title="Minimize" aria-label="Minimize"></button>
      </div>

      <div id="brand">
        <span id="title">Claude Usage Monitor</span>
      </div>

      <div id="titleActions">
        <button id="refreshBtn" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
          </svg>
        </button>
        <!-- Theme toggle lives in the tray menu on the desktop build; this
             stays for the Chrome extension, which has no tray. -->
        <button id="themeBtn" title="Switch theme">
          <svg id="iconMoon" viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 1 0 20.354 15.354z"/></svg>
          <svg id="iconSun" viewBox="0 0 24 24" width="15" height="15" class="hidden" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
          </svg>
        </button>
      </div>
    </header>

    <div id="content">
      <div id="peakRow">
        <span id="peakDot" class="dot"></span>
        <span id="peakLabel">Checking peak hours&hellip;</span>
      </div>

      <div id="rings">
        <div class="ring-card stat-card" id="card-five-hour">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120">
              <circle class="ring-track" cx="60" cy="60" r="52"></circle>
              <circle class="ring-progress" id="ring-five-hour" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="ring-center">
              <span class="ring-pct" id="pct-five-hour">--</span><span class="ring-pct-sign">%</span>
            </div>
          </div>
          <div class="ring-label">5-HOUR LIMIT</div>
          <div class="ring-sub" id="sub-five-hour">--</div>
        </div>

        <div class="ring-card stat-card" id="card-weekly">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120">
              <circle class="ring-track" cx="60" cy="60" r="52"></circle>
              <circle class="ring-progress" id="ring-weekly" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="ring-center">
              <span class="ring-pct" id="pct-weekly">--</span><span class="ring-pct-sign">%</span>
            </div>
          </div>
          <div class="ring-label">7-DAY LIMIT</div>
          <div class="ring-sub" id="sub-weekly">--</div>
        </div>
      </div>

      <div class="stat" id="stat-credits">
        <div class="stat-row">
          <span class="stat-label">Usage credits</span>
          <span class="stat-values">
            <span class="stat-value">--</span>
            <span class="stat-balance hidden">--</span>
          </span>
        </div>
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="stat-sub">--</div>
      </div>

      <div id="errorBox" class="hidden">
        Could not reach claude.ai. Make sure you're logged in, then hit refresh.
      </div>

      <div id="activity">
        <div id="activityHeader">
          <span id="activityTitle">Activity</span>
          <div id="activityToggle">
            <button class="toggleBtn active" data-range="week">Week</button>
            <button class="toggleBtn" data-range="month">Month</button>
          </div>
        </div>
        <div id="activityGrid"></div>
        <div id="activityEmpty" class="hidden">Building your activity picture as you use Claude&hellip;</div>
      </div>
    </div>

    <footer id="footer">
      <a id="brandLink" class="extLink" href="https://www.cfninjas.com" title="cfninjas.com">
        <svg id="logo" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-dasharray="18 40" transform="rotate(-90 12 12)"></circle>
        </svg>
        <span>CF Ninjas AI</span>
      </a>
      <a id="claudeLink" class="extLink" href="https://claude.ai/settings/usage"
         title="Open your Claude usage settings">Claude.ai</a>
      <span id="updatedAt">Loading&hellip;</span>
    </footer>
  </div>

  <script>
    // Electron build only: preload.js can't expose anything named "chrome"
    // directly (Chromium's renderer already defines one), so it hands us
    // the real shim under a private name and we assign it here, in normal
    // page-context JS, before widget.js runs. No-op in the Chrome
    // extension, where window.chrome is already the real extension API and
    // __cfninjas_chrome is simply never defined.
    if (window.__cfninjas_chrome) { window.chrome = window.__cfninjas_chrome; }
  </script>
  <script src="jquery.min.js"></script>
  <script src="widget.js"></script>
</body>
</html>
